id: tsavorite-garnet
names: { zh: 沙弗莱石榴石, en: Tsavorite Garnet }
category:
  mineral_zh: 石榴石族
  mineral_en: Garnet
  chemical_formula: Ca₃Al₂(SiO₄)₃
  crystal_system: cubic
physical:
  hardness_mohs: 7.25
  specific_gravity: 3.61
  refractive_index: 1.739-1.744
optical:
  typical_colors:
    - { zh: 森林绿, en: Forest Green }
    - { zh: 草绿, en: Grass Green }
  color_causes_zh: V³⁺ 与 Cr³⁺ 离子致色
  color_causes_en: V³⁺ and Cr³⁺ trace ions
treatments:
  common: []
  disclosure_required: false
  note_zh: 无处理需求；稀缺性来自肯尼亚/坦桑尼亚小矿脉
  note_en: No treatment needed; scarcity from small Kenya/Tanzania veins


origin:
  - { zh: "肯尼亚", en: "Kenya" }
  - { zh: "坦桑尼亚", en: "Tanzania" }
history_zh: |
  1967年由苏格兰宝石学家坎贝尔·布里奇斯在肯尼亚发现，蒂芙尼以肯尼亚沙弗国家公园命名。翠绿不输祖母绿且更耐久。
history_en: |
  Discovered in Kenya in 1967 by Campbell Bridges; named by Tiffany for Tsavo National Park. Green rivaling emerald with better durability.
