id: rock-crystal
names: { zh: 水晶, en: Rock Crystal }
category:
  mineral_zh: 石英族
  mineral_en: Quartz (crystalline)
  chemical_formula: SiO₂
  crystal_system: trigonal
physical:
  hardness_mohs: 7
  specific_gravity: 2.65
  refractive_index: 1.544-1.553
optical:
  pleochroism: none
  typical_colors:
    - { zh: 无色透明, en: 'Colorless, transparent' }
  color_causes_zh: 无致色元素
  color_causes_en: No chromophore elements present
treatments:
  common: [heat-treatment, irradiation]
  disclosure_required: false
  note_zh: 最常见天然宝石原料，全球广泛分布；含发晶、水胆水晶等变种
  note_en: The most common natural gem material, distributed worldwide; includes rutilated quartz and enhydro varieties
images:
  main: rock-crystal.jpg
  gallery: [rock-crystal-gallery-1.svg, rock-crystal-gallery-2.svg, rock-crystal-gallery-3.svg]

origin:
  - { zh: "巴西", en: "Brazil" }
  - { zh: "中国", en: "China" }
  - { zh: "马达加斯加", en: "Madagascar" }
  - { zh: "美国阿肯色", en: "Arkansas, USA" }
history_zh: |
  水晶自古被视为冰之凝晶，希腊语"krystallos"即冰。全球广泛分布。
history_en: |
  Rock crystal was long thought to be frozen ice (Greek 'krystallos'). Distributed worldwide.
