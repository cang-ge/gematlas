id: alexandrite
names: { zh: 亚历山大石, en: Alexandrite }
category:
  mineral_zh: 金绿宝石族
  mineral_en: Chrysoberyl
  chemical_formula: BeAl₂O₄
  crystal_system: orthorhombic
physical:
  hardness_mohs: 8.5
  specific_gravity: 3.73
  refractive_index: 1.746-1.755
optical:
  pleochroism: strong
  typical_colors:
    - { zh: 日光下绿, en: Green in daylight }
    - { zh: 灯光下红, en: Red in incandescent light }
  color_causes_zh: Cr³⁺ 离子致变色效应
  color_causes_en: Cr³⁺ causes color-change effect
treatments:
  common: []
  disclosure_required: false
  note_zh: 几乎无处理；产地溢价显著（俄罗斯/巴西/斯里兰卡）
  note_en: Virtually untreated; origin commands significant premium


origin:
  - { zh: "俄罗斯乌拉尔", en: "Ural Mountains, Russia" }
  - { zh: "巴西", en: "Brazil" }
  - { zh: "斯里兰卡", en: "Sri Lanka" }
history_zh: |
  1830年首次发现于俄罗斯乌拉尔，以沙皇亚历山大二世命名。日光下绿、灯光下红的变色效应使其极为罕见珍贵。
history_en: |
  Discovered in the Urals in 1830 and named for Tsar Alexander II. Its green-to-red colour change makes it among the rarest gems.
images:
  main: alexandrite-gallery-1.jpg
  gallery: [alexandrite-gallery-2.jpg, alexandrite-gallery-3.jpg, alexandrite.jpg]
