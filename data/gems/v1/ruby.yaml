# Ruby (corundum family). Source: GIA Encyclopedia + Schumann (2009).
id: ruby
names:
  zh: 红宝石
  en: Ruby
category:
  mineral_zh: 刚玉族
  mineral_en: Corundum
  chemical_formula: Al₂O₃
  crystal_system: trigonal
physical:
  hardness_mohs: 9
  hardness_note_zh: 仅次于钻石
  hardness_note_en: Second only to diamond
  specific_gravity: 4.00
  refractive_index: 1.762-1.770
optical:
  pleochroism: strong
  typical_colors:
    - { zh: 鸽血红, en: Pigeon Blood }
    - { zh: 樱桃红, en: Cherry Red }
    - { zh: 玫瑰红, en: Rose Red }
  color_causes_zh: Cr³⁺ 离子致色
  color_causes_en: Chromium (Cr³⁺) trace ions
treatments:
  common:
    - heat-treatment
  disclosure_required: true
  note_zh: 绝大多数商业红宝石经过热处理，市场可接受；无处理溢价显著
  note_en: Most commercial rubies are heat-treated; untreated stones command significant premiums
images:
  main: ruby-gallery-3.jpg
  gallery: [ruby-gallery-2.jpg, ruby.jpg, ruby-gallery-1.jpg]

origin:
  - { zh: "缅甸莫谷", en: "Mogok, Myanmar" }
  - { zh: "莫桑比克", en: "Mozambique" }
  - { zh: "泰国", en: "Thailand" }
history_zh: |
  红宝石是五大名宝之首，缅甸莫谷（Mogok）产出的"鸽血红"最负盛名。古印度称其为"宝石之王"，早期贸易沿丝绸之路西传。
history_en: |
  Ruby is the king of coloured gems; Mogok (Myanmar) 'pigeon-blood' stones set the benchmark. Revered in India as the 'lord of gems', it reached Europe along the Silk Road.
