# Ruby (corundum family). Sources: GIA Encyclopedia + Schumann (2009); treatment note: https://www.gia.edu/cn/FAQ/gia-faq-heat-treatment-ruby and https://www.gia.edu/ruby/buyers-guide.
id: ruby
names:
  zh: 红宝石
  en: Ruby
category:
  mineral_zh: 刚玉族
  mineral_en: Corundum
  chemical_formula: Al₂O₃
  crystal_system: trigonal
physical:
  hardness_mohs: 9
  hardness_note_zh: 仅次于钻石
  hardness_note_en: Second only to diamond
  specific_gravity: 4.00
  refractive_index: 1.762-1.770
optical:
  pleochroism: strong
  typical_colors:
    - { zh: 鸽血红, en: Pigeon Blood }
    - { zh: 樱桃红, en: Cherry Red }
    - { zh: 玫瑰红, en: Rose Red }
  color_causes_zh: Cr³⁺ 离子致色
  color_causes_en: Chromium (Cr³⁺) trace ions
treatments:
  common:
    - heat-treatment
  disclosure_required: true
  note_zh: GIA指出，有独立实验室报告确认未见加热证据的红宝石因稀有性通常有溢价；单颗宝石价值还受颜色、净度、尺寸、产地及其他处理影响。
  note_en: GIA notes that rubies with an independent lab report confirming no evidence of heat treatment command a premium due to rarity; an individual stone's value also depends on color, clarity, size, origin, and other treatments.


origin:
  - { zh: "缅甸莫谷", en: "Mogok, Myanmar" }
  - { zh: "莫桑比克", en: "Mozambique" }
  - { zh: "泰国", en: "Thailand" }
history_zh: |
  红宝石是五大名宝之首，缅甸莫谷（Mogok）产出的"鸽血红"最负盛名。古印度称其为"宝石之王"，早期贸易沿丝绸之路西传。
history_en: |
  Ruby is the king of coloured gems; Mogok (Myanmar) 'pigeon-blood' stones set the benchmark. Revered in India as the 'lord of gems', it reached Europe along the Silk Road.
images:
  main: ruby.png
  gallery: [ruby-gallery-1.png, ruby-gallery-2.png]
