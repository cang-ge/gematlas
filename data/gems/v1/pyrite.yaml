id: pyrite
names: { zh: 黄铁矿, en: Pyrite }
category:
  mineral_zh: 硫化物
  mineral_en: Sulfide
  chemical_formula: FeS₂
  crystal_system: cubic
physical:
  hardness_mohs: 6.5
  specific_gravity: 5.01
  refractive_index: 1.810-2.024
optical:
  pleochroism: none
  typical_colors:
    - { zh: 黄铜色至金棕色, en: 'Brass-yellow to golden brown' }
  color_causes_zh: Fe-S 电荷转移致金黄色金属光泽
  color_causes_en: Fe-S charge transfer produces golden-yellow metallic luster
treatments:
  common: [surface-coating]
  disclosure_required: true
  note_zh: 别名"愚人金"，易与真金混淆；常作为装饰材料
  note_en: Known as "fool's gold," often confused with real gold; widely used in decorative jewelry


origin:
  - { zh: "西班牙", en: "Spain" }
  - { zh: "秘鲁", en: "Peru" }
  - { zh: "美国伊利诺伊", en: "Illinois, USA" }
history_zh: |
  黄铁矿"愚人金"常被误认为黄金。印加文明用之制镜，阿兹特克饰之。
history_en: |
  Pyrite 'fool's gold' mimics gold. The Inca made mirrors from it; Aztecs adorned themselves with it.
images:
  main: pyrite.jpg
  gallery: [pyrite-gallery-1.jpg, pyrite-gallery-2.jpg, pyrite-gallery-3.jpg]
