id: sunstone
names: { zh: 太阳石, en: Sunstone }
category:
  mineral_zh: 长石族
  mineral_en: Feldspar (Oligoclase / Labradorite)
  chemical_formula: (Na,Ca)(Si,Al)₄O₈ + Cu/Fe platelets
  crystal_system: triclinic
physical:
  hardness_mohs: 6.25
  specific_gravity: 2.64
  refractive_index: 1.537-1.547
optical:
  pleochroism: none
  typical_colors:
    - { zh: 橙红色带金色闪, en: 'Red-orange with golden shimmer' }
    - { zh: 桃红色, en: 'Peach' }
    - { zh: 黄绿色, en: 'Yellow-green' }
  color_causes_zh: 含铜/赤铁矿薄片产生砂金效应（见光学现象-砂金效应）
  color_causes_en: Copper/hematite platelets produce aventurescence (see Optical Phenomena — Aventurescence)
treatments:
  common: []
  disclosure_required: false
  note_zh: 美国俄勒冈太阳石以含天然铜片（无需优化）而闻名
  note_en: Oregon sunstone is famous for natural copper platelets that need no enhancement


origin:
  - { zh: "美国俄勒冈", en: "Oregon, USA" }
  - { zh: "印度", en: "India" }
  - { zh: "挪威", en: "Norway" }
history_zh: |
  太阳石含赤铁矿/铜片产生金黄闪光（aventurescence），俄勒冈铜太阳石尤为著名。
history_en: |
  Sunstone's golden flash (aventurescence) comes from hematite/copper platelets; Oregon copper sunstone is celebrated.
images:
  main: sunstone.jpg
  gallery: [sunstone-gallery-1.jpg]
