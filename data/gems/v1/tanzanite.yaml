id: tanzanite
names: { zh: 坦桑石, en: Tanzanite }
category:
  mineral_zh: 黝帘石族
  mineral_en: Zoisite
  chemical_formula: Ca₂Al₃(SiO₄)₃(OH)
  crystal_system: orthorhombic
physical:
  hardness_mohs: 6.5
  hardness_note_zh: 性较脆，注意避免撞击
  hardness_note_en: Relatively brittle
  specific_gravity: 3.35
  refractive_index: 1.691-1.700
optical:
  pleochroism: strong
  typical_colors:
    - { zh: 蓝紫, en: Blue-Violet }
    - { zh: 紫罗兰, en: Violet-Blue }
  color_causes_zh: V³⁺ 离子致色
  color_causes_en: Vanadium (V³⁺) trace ions
treatments:
  common:
    - heat-treatment
  disclosure_required: true
  note_zh: 几乎所有坦桑石均经热处理以增强蓝紫调
  note_en: Almost all tanzanite is heat-treated to enhance blue-violet


origin:
  - { zh: "坦桑尼亚（梅雷拉尼山）", en: "Merelani Hills, Tanzania" }
history_zh: |
  1967年在坦桑尼亚阿鲁沙附近发现，由蒂芙尼命名推广。全世界仅此一处产地，稀有度极高。
history_en: |
  Found near Arusha in 1967 and promoted by Tiffany. With a single source worldwide, it is exceptionally rare.
images:
  main: tanzanite.jpg
  gallery: [tanzanite-gallery-1.jpg, tanzanite-gallery-2.jpg, tanzanite-gallery-3.svg]
