id: prehnite
names: { zh: 葡萄石, en: Prehnite }
category:
  mineral_zh: 硅酸盐（层状）
  mineral_en: Phyllosilicate
  chemical_formula: Ca₂Al(AlSi₃O₁₀)(OH)₂
  crystal_system: orthorhombic
physical:
  hardness_mohs: 6.25
  specific_gravity: 2.90
  refractive_index: 1.611-1.672
optical:
  pleochroism: weak
  typical_colors:
    - { zh: 浅绿色（葡萄绿）, en: 'Pale green' }
    - { zh: 黄绿色, en: 'Yellow-green' }
    - { zh: 无色至白色, en: 'Colorless to white' }
  color_causes_zh: Fe³⁺ 致浅绿至黄绿
  color_causes_en: Fe³⁺ produces pale to yellow-green
treatments:
  common: []
  disclosure_required: false
  note_zh: 常与葡萄状晶形关联；镶嵌以吊坠/雕刻为主
  note_en: Named for its botryoidal (grape-like) habit; primarily used in pendants and carvings


origin:
  - { zh: "南非", en: "South Africa" }
  - { zh: "澳大利亚", en: "Australia" }
  - { zh: "中国", en: "China" }
  - { zh: "美国新泽西", en: "New Jersey, USA" }
history_zh: |
  葡萄石以荷兰殖民者Hendrik von Prehn命名，是首个以人名命名的矿物。
history_en: |
  Prehnite was named for Dutch colonist Hendrik von Prehn — the first mineral named after a person.
images:
  main: prehnite.jpg
  gallery: [prehnite-gallery-1.png, prehnite-gallery-2.jpg, prehnite-gallery-3.jpg]
