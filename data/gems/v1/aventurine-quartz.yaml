id: aventurine-quartz
names: { zh: 东陵石 / 砂金石, en: Aventurine Quartz }
category:
  mineral_zh: 石英族
  mineral_en: Quartz (microcrystalline)
  chemical_formula: SiO₂ + Cr-mica / hematite
  crystal_system: trigonal
physical:
  hardness_mohs: 7
  specific_gravity: 2.64
  refractive_index: 1.544-1.553
optical:
  pleochroism: none
  typical_colors:
    - { zh: 绿色, en: Green }
    - { zh: 红棕色, en: 'Red-brown' }
    - { zh: 蓝色, en: 'Blue' }
  color_causes_zh: 绿色：铬云母包裹体；红棕色：赤铁矿包裹体
  color_causes_en: Green from fuchsite (chrome mica) inclusions; red-brown from hematite
treatments:
  common: [dyeing]
  disclosure_required: true
  note_zh: '商业蓝色变种多为染色产物；绿色最常见，源自印度市场'
  note_en: Commercial blue varieties are often dyed; green is the most common natural color, sourced mainly from India


origin:
  - { zh: "印度", en: "India" }
  - { zh: "巴西", en: "Brazil" }
  - { zh: "西班牙", en: "Spain" }
history_zh: |
  东陵石的闪金效应（aventurescence）由云母/赤铁矿包体产生，名称源自意大利"偶然"（per avventura）。
history_en: |
  Aventurine's sparkle comes from mica/hematite inclusions; the name stems from Italian 'per avventura' (by chance).
images:
  main: aventurine-quartz-gallery-1.jpg
  gallery: [aventurine-quartz-gallery-2.jpg, aventurine-quartz-gallery-3.jpg, aventurine-quartz.jpg]
