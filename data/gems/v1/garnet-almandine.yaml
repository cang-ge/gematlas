id: garnet-almandine
names: { zh: 铁铝榴石, en: 'Almandine (Garnet)' }
category:
  mineral_zh: 石榴石族
  mineral_en: Garnet (Almandine)
  chemical_formula: Fe₃Al₂(SiO₄)₃
  crystal_system: cubic
physical:
  hardness_mohs: 7.25
  specific_gravity: 4.05
  refractive_index: 1.770-1.820
optical:
  pleochroism: none
  typical_colors:
    - { zh: 深红色, en: 'Deep red' }
    - { zh: 紫红色, en: 'Purplish red' }
    - { zh: 褐红色, en: 'Brownish red' }
  color_causes_zh: Fe²⁺ 致深红色
  color_causes_en: Fe²⁺ produces deep red color
treatments:
  common: []
  disclosure_required: false
  note_zh: 商业最常见石榴石，通常无处理
  note_en: Most common commercial garnet, typically untreated


origin:
  - { zh: "印度", en: "India" }
  - { zh: "斯里兰卡", en: "Sri Lanka" }
  - { zh: "美国", en: "USA" }
  - { zh: "马达加斯加", en: "Madagascar" }
history_zh: |
  铁铝榴石是最常见的红色石榴石，中世纪宝石商称其为"石榴石"（石榴籽）。
history_en: |
  Almandine is the common red garnet; medieval lapidaries coined 'garnet' from pomegranate seeds.
