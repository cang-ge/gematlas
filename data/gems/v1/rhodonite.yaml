id: rhodonite
names: { zh: 蔷薇辉石, en: Rhodonite }
category:
  mineral_zh: 辉石族（紫苏辉石型）
  mineral_en: Pyroxenoid
  chemical_formula: MnSiO₃
  crystal_system: triclinic
physical:
  hardness_mohs: 6.25
  specific_gravity: 3.68
  refractive_index: 1.716-1.752
optical:
  pleochroism: weak
  typical_colors:
    - { zh: 玫瑰红色，带黑色氧化锰纹, en: 'Rose-red with black Mn-oxide veining' }
    - { zh: 粉红色, en: 'Pink' }
    - { zh: 红褐色, en: 'Reddish-brown' }
  color_causes_zh: Mn²⁺ 致粉红至玫瑰红
  color_causes_en: Mn²⁺ produces pink to rose-red
treatments:
  common: [wax-impregnation]
  disclosure_required: true
  note_zh: 俄罗斯"苏联石"（Rhodonite）是最著名产地品种
  note_en: Russian "Rhodonite" from the Ural Mountains is the most famous source variety


origin:
  - { zh: "俄罗斯乌拉尔", en: "Urals, Russia" }
  - { zh: "瑞典", en: "Sweden" }
  - { zh: "澳大利亚", en: "Australia" }
  - { zh: "美国马萨诸塞", en: "Massachusetts, USA" }
history_zh: |
  蔷薇辉石粉色含黑色锰氧化物网纹，俄罗斯以之制巨型装饰，马萨诸塞州石。
history_en: |
  Rhodonite's pink carries black manganese veining; Russia made grand ornaments and it is the Massachusetts state stone.
images:
  main: rhodonite.jpg
  gallery: [rhodonite-gallery-1.jpg, rhodonite-gallery-2.jpg, rhodonite-gallery-3.jpg]
