id: aquamarine
names: { zh: 海蓝宝, en: Aquamarine }
category:
  mineral_zh: 绿柱石族
  mineral_en: Beryl
  chemical_formula: Be₃Al₂Si₆O₁₈
  crystal_system: hexagonal
physical:
  hardness_mohs: 7.75
  specific_gravity: 2.68
  refractive_index: 1.564-1.596
optical:
  pleochroism: weak
  typical_colors:
    - { zh: 浅蓝色, en: 'Sky blue' }
    - { zh: 海蓝色, en: 'Sea blue' }
    - { zh: 绿蓝色, en: 'Greenish blue' }
  color_causes_zh: Fe²⁺ 离子吸收红黄光 → 透射蓝绿色
  color_causes_en: Fe²⁺ ion absorbs red-yellow light → transmitted blue-green
treatments:
  common: [heat-treatment]
  disclosure_required: true
  note_zh: 加热可使绿色调转为稳定的蓝色
  note_en: Heat treatment can convert greenish hues to stable blue
images:
  main: aquamarine-gallery-2.jpg
  gallery: [aquamarine-gallery-3.jpg, aquamarine.jpg, aquamarine-gallery-1.jpg]

origin:
  - { zh: "巴西米纳斯吉拉斯", en: "Minas Gerais, Brazil" }
  - { zh: "马达加斯加", en: "Madagascar" }
  - { zh: "巴基斯坦", en: "Pakistan" }
history_zh: |
  与祖母绿同属绿柱石族。巴西米纳斯吉拉斯产出品质最佳的海蓝宝，常用作航海护身符。
history_en: |
  Beryl cousin of emerald. Brazil's Minas Gerais yields the finest aquamarine, long a sailor's talisman.
