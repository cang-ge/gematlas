# Sources: GIA Spinel facts (https://www.gia.edu/spinel); treatment context: GIA care guide (https://www.gia.edu/spinel-care-cleaning), nickel diffusion report (https://www.gia.edu/gia-news-press/gia-researchers-identify-new-spinel-treatment).
id: spinel
names: { zh: 尖晶石, en: Spinel }
category:
  mineral_zh: 尖晶石族
  mineral_en: Spinel
  chemical_formula: MgAl₂O₄
  crystal_system: cubic
physical:
  hardness_mohs: 8
  specific_gravity: 3.60
  refractive_index: "1.718"
optical:
  typical_colors:
    - { zh: 绝地武士红, en: Jedi Red }
    - { zh: 钴蓝, en: Cobalt Blue }
    - { zh: 薰衣草紫, en: Lavender }
  color_causes_zh: Cr³⁺ 致红；Fe²⁺ 致蓝；V 致多种色调
  color_causes_en: Cr³⁺ (red); Fe²⁺ (blue); V (varied)
treatments:
  common: []
  disclosure_required: true
  note_zh: 尖晶石通常少见处理，但已有少量热处理、扩散处理及裂隙充填记录；如确认经过处理，应按销售地法规和交易规则披露。天然/合成及具体处理状态不能仅凭外观确认，重要交易应查验独立实验室报告。
  note_en: Spinel is rarely treated, but heat treatment, diffusion treatment, and fracture filling have been documented. If treatment is identified, disclose it as required by applicable local rules and trade practice. Natural/synthetic status and specific treatment cannot be confirmed by appearance alone; consult an independent laboratory report for significant transactions.


origin:
  - { zh: "缅甸", en: "Myanmar" }
  - { zh: "塔吉克斯坦（帕米尔）", en: "Pamir, Tajikistan" }
  - { zh: "越南", en: "Vietnam" }
history_zh: |
  红尖晶石长期与红宝石混名——英国"黑王子红宝石"和"铁木尔红宝石"实为尖晶石。缅甸曼辛是高品质产地。
history_en: |
  Red spinel was long confused with ruby — Britain's 'Black Prince's Ruby' and 'Timur Ruby' are both spinels. Myanmar's Man Sin yields fine stones.
images:
  main: spinel.jpg
  gallery: [spinel-gallery-1.jpg, spinel-gallery-2.jpg, spinel-gallery-3.jpg]
