id: opal
names: { zh: 欧泊, en: Opal }
category:
  mineral_zh: 蛋白石
  mineral_en: Opal
  chemical_formula: SiO₂·nH₂O
  crystal_system: amorphous
physical:
  hardness_mohs: 5.5
  hardness_note_zh: 含水，避免高温与脱水
  hardness_note_en: Hydrated; avoid heat and dehydration
  specific_gravity: 2.10
  refractive_index: 1.370-1.470
optical:
  typical_colors:
    - { zh: 黑欧泊, en: Black Opal }
    - { zh: 白欧泊, en: White Opal }
    - { zh: 火欧泊, en: Fire Opal }
  color_causes_zh: 二氧化硅球粒衍射光栅产生变彩
  color_causes_en: Silica sphere diffraction grating produces play-of-color
treatments:
  common:
    - sugar-acid-treatment
  disclosure_required: true
  note_zh: 糖酸处理用于仿黑欧泊，需披露
  note_en: Sugar-acid treatment simulates black opal; must be disclosed
images:
  main: opal-gallery-3.jpg
  gallery: [opal.jpg, opal-gallery-1.jpg, opal-gallery-2.jpg]

origin:
  - { zh: "澳大利亚（南澳）", en: "Andamooka / Lightning Ridge, Australia" }
  - { zh: "埃塞俄比亚", en: "Ethiopia" }
  - { zh: "墨西哥", en: "Mexico" }
history_zh: |
  澳大利亚供应全球约95%的珍贵欧泊。火欧泊与黑欧泊（闪电岭）尤为珍贵，古罗马视欧泊为最珍贵宝石。
history_en: |
  Australia supplies ~95% of precious opal. Mexican fire opal and Lightning Ridge black opal are most prized; Rome ranked opal above all.
