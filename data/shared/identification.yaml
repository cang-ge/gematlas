# Gem identification taxonomy — tests that tell one stone from another.
#
# Each entry is one identification topic. Generator emits a bilingual subpage
# per entry plus the overview. References: GIA Gem Identification;
# Schumann, *Gemstones of the World*; Nassau, *Gemstone Enhancement*;
# AGL / GIA / SSEF identification procedures.

