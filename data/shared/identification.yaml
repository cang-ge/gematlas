# Gem identification taxonomy — tests that tell one stone from another.
#
# Each entry is one identification topic. Generator emits a bilingual subpage
# per entry plus the overview. References: GIA Gem Identification;
# Schumann, *Gemstones of the World*; Nassau, *Gemstone Enhancement*;
# AGL / GIA / SSEF identification procedures.

overview_zh: |
  鉴定是一门测量物理与光学性质来区分天然宝石、合成品与仿品的学科。
  本模块介绍三类基础测试——物理性质测试（RI / SG / 硬度 / 解理）、
  光学测试（双折射 / 多色性 / 紫外荧光）、以及合成品与仿品的鉴别；
  另以同色宝石判别作为综合应用练习。
overview_en: |
  Identification measures physical and optical properties to separate
  natural gems, synthetics, and imitations. This module covers three foundational test
  groups — physical tests (RI / SG / hardness / cleavage), optical tests
  (birefringence / pleochroism / UV fluorescence), and distinguishing
  synthetics and imitations, with same-colour comparison as an applied case.

topics:
  - id: identification-workflow
    name_zh: 鉴定工作流与记录
    name_en: Identification Workflow & Documentation
    summary_zh: |
      专业鉴定不是寻找一个“神奇读数”，而是建立可复核的证据链。先记录样品状态，
      再从低风险观察开始，逐步组合物理、光学和包裹体线索；最后明确结论的置信边界、
      处理披露与是否需要实验室报告。
    summary_en: |
      Professional identification is not a search for one “magic reading”; it is a
      reproducible chain of evidence. Record the sample first, begin with low-risk
      observations, combine physical, optical, and inclusion clues, then state the
      confidence limits, treatment disclosure, and whether a laboratory report is needed.
    steps_zh: |
      **1. 先记录样品与任务边界**

      记录尺寸、重量、镶嵌状态、已知来源、可见损伤和委托目的。镶嵌石、涂油石或无法接触
      的样品，应在记录中注明哪些测试无法可靠完成。

      **2. 从无损观察开始**

      在白光、点光源和适当放大下观察体色、透明度、光泽、切工、包裹体与光学现象；先写下
      观察事实，再写候选判断，避免把名称当成观察结果。

      **3. 按风险递进测试**

      优先考虑折射率、偏光镜、二色镜、紫外荧光和光谱等非破坏性线索；比重测试要评估样品
      是否适合浸液，划痕测试只在必要且获准时考虑。

      **4. 交叉验证与分级结论**

      将读数与候选品种的特征范围、处理可能性和样品限制逐项比对。结论应区分“支持候选”、
      “与候选一致”和“无法排除”，不要把单项测试写成最终鉴定。

      **5. 需要时转交实验室**

      涉及天然/合成判断、产地意见、重大交易或保险用途时，应保留原始记录并交由具备资质的
      实验室完成更高阶检测。
    steps_en: |
      **1. Record the sample and scope**

      Note dimensions, weight, mounting, known provenance, visible damage, and the purpose of the
      examination. Record which tests are unreliable or unavailable for mounted, oiled, or inaccessible samples.

      **2. Start with non-destructive observation**

      Under white light, a point source, and suitable magnification, record body color, transparency,
      luster, cut, inclusions, and phenomena. Write observations before candidate names.

      **3. Escalate tests by risk**

      Prefer refractive index, polariscope, dichroscope, UV fluorescence, and spectroscopy as non-destructive
      clues. Assess whether a specific-gravity liquid test is suitable; scratch testing requires a clear need and permission.

      **4. Cross-check and grade the conclusion**

      Compare readings with candidate ranges, treatment possibilities, and sample limitations. Distinguish
      “supports a candidate”, “consistent with a candidate”, and “cannot exclude”; a single test is not a final ID.

      **5. Refer to a laboratory when needed**

      For natural-versus-synthetic decisions, origin opinions, major transactions, or insurance, preserve raw
      observations and refer the sample to a qualified laboratory for advanced testing.
    principles_zh: |
      - 记录“看到了什么”与“因此怀疑什么”两栏，避免观察与结论互相污染。
      - 仪器读数应带测试条件、方向、接触状态和重复结果，不能脱离上下文比较。
      - 结论强度必须低于证据强度：筛分结果不是鉴定证书，产地意见也不是分级。
      - 任何破坏性测试都要先确认授权、样品价值与安全条件。
    principles_en: |
      - Keep separate fields for “what was observed” and “what it suggests” so observation and conclusion do not contaminate each other.
      - Record test conditions, orientation, contact state, and repeated readings; values cannot be compared without context.
      - Keep the conclusion weaker than the evidence: a screen is not a certificate, and an origin opinion is not a grade.
      - Confirm permission, sample value, and safety conditions before any destructive test.
    examples:
      - { gem: "mounted ruby", gem_zh: "镶嵌红宝石", value: "screen first; report inaccessible tests", value_zh: "先做筛分，并记录无法接触的测试", note_zh: "镶嵌状态限制", note_en: "mounting limits access" }

  - id: physical-tests
    name_zh: 物理性质测试
    name_en: Physical Tests
    summary_zh: |
      折射率 (RI)、比重 (SG)、硬度、解理是最基础的鉴定手段——它们由
      矿物化学成分与晶体结构影响；同一品种通常落在可比的特征范围，
      但测量条件、方向、处理和样品状态都会影响读数。
    summary_en: |
      Refractive index, specific gravity, hardness, and cleavage are the
      most basic identification tools — influenced by chemistry and crystal
      structure, so each species tends to fall within a comparable range; conditions,
      orientation, treatment, and sample state can shift the reading.
    principles_zh: |
      - 折射率 (RI)：折射仪读数，钻石 2.42、刚玉 1.76、石英 1.54 等。
      - 比重 (SG)：空气中与水中称重比，可区分同色不同种宝石。
      - 硬度：莫氏 1–10，划痕测试是破坏性的，只在必要时用。
      - 解理：沿原子面断裂的倾向，钻石八面体解理、宝石级可见。
    principles_en: |
      - Refractive index: refractometer reading; diamond 2.42, corundum 1.76, quartz 1.54.
      - Specific gravity: weigh in air vs water; separates same-colour species.
      - Hardness: Mohs 1–10; scratch tests are destructive — use only when needed.
      - Cleavage: tendency to break along atomic planes; octahedral in diamond.
    examples:
      - { gem: "diamond", value: "RI 2.42, SG 3.52", note_en: "highest RI of gems" }
      - { gem: "ruby", value: "RI 1.76, SG 4.00", note_en: "corundum signature" }

  - id: optical-tests
    name_zh: 光学测试
    name_en: Optical Tests
    summary_zh: |
      双折射（偏光镜）、多色性（二色镜）、紫外荧光（紫外灯）提供宝石的
      光学与材料线索，可用于快速筛分品种并提示进一步检测方向。
    summary_en: |
      Birefringence (polariscope), pleochroism (dichroscope), and UV
      fluorescence (UV lamp) provide optical and material clues — useful
      for screening species and deciding what to test next.
    principles_zh: |
      - 双折射：光在非均质宝石中分裂，值越高（如锆石 0.059）越易识别。
      - 多色性：二色镜观察，堇青石三色性强、红宝石紫红/橙红。
      - 紫外荧光：LW/SW 紫外灯下反应，帮助区分天然 vs 合成、产地线索。
      - 光谱 (spectroscope)：吸收谱带是"指纹"，鉴定变色宝石与产地。
    principles_en: |
      - Birefringence: light splits in anisotropic gems; zircon 0.059 is distinctive.
      - Pleochroism: dichroscope shows colour variation; iolite strongly trichroic.
      - UV fluorescence: LW/SW lamp reaction helps separate natural vs synthetic.
      - Spectroscope: absorption bands are a fingerprint for species and origin.
    examples:
      - { gem: "zircon", value: "DR 0.059", note_en: "double image visible" }
      - { gem: "iolite", value: "strong trichroism", note_en: "blue/violet/yellow" }

  - id: synthetic-and-imitation
    name_zh: 合成品与仿品鉴别
    name_en: Synthetics & Imitations
    summary_zh: |
      合成宝石（同化学成分，如焰熔法红宝石、水热法祖母绿、CVD 钻石）与
      仿品（不同成分，如玻璃、立方氧化锆、仿祖母绿双层石）需要不同的
      鉴别路径。
    summary_en: |
      Synthetics (same chemistry — flux ruby, hydrothermal emerald, CVD
      diamond) and imitations (different chemistry — glass, cubic zirconia,
      doublets) demand different identification routes.
    principles_zh: |
      - 合成红/蓝宝石：焰熔法曲线生长纹、气泡；水热法含铂片/不规则包裹体。
      - CVD/HPHT 钻石：与天然钻石同为碳，需紫外荧光分带 + 光谱仪判断。
      - 立方氧化锆 (CZ)：SG 5.65、异常色散、棱角锋利——与钻石区别明显。
      - 玻璃仿品：气泡、旋涡纹、流动纹；折射率常在 1.5–1.7 区间。
    principles_en: |
      - Synthetic ruby/sapphire: flux curved striae and bubbles; hydrothermal has platinum flakes.
      - CVD/HPHT diamond: chemically identical to natural — needs UV banding + spectroscopy.
      - Cubic zirconia: SG 5.65, excessive dispersion, sharp facet edges — clearly not diamond.
      - Glass imitations: bubbles, swirls, flow lines; RI usually 1.5–1.7.
    examples:
      - { gem: "diamond", value: "CZ (cubic zirconia)", note_en: "SG 5.65 vs 3.52" }
      - { gem: "emerald", value: "hydrothermal", note_en: "needs lab verification" }

  - id: same-color-gems
    name_zh: 同色宝石判别
    name_en: Same-Colour Gems
    summary_zh: |
      同一种颜色可能对应多种宝石——红色可能是红宝石、尖晶石、石榴石或玻璃。
      结合 RI / SG / 多色性 / 包裹体，可把同色宝石逐一排除。以下流程图
      覆盖红色、蓝色、绿色三大最易混淆家族。
    summary_en: |
      One colour can hide many species — red may be ruby, spinel, garnet,
      or glass. Combining RI / SG / pleochroism / inclusions eliminates
      candidates one by one. The trees below cover the three most confusing
      families: red, blue, and green.
    steps_zh: |
      **1. 用折射仪测量折射率（RI）**

      | RI 读数 | 可能家族 | 下一步 |
      |---|---|---|
      | 1.76 | 刚玉（红宝石/蓝宝石）| 第 2 步 |
      | 1.71–1.72 | 尖晶石候选 | 需结合 SG、包裹体与光谱复核 |
      | 1.74–1.89 | 石榴石候选 | 需结合 SG、包裹体与光谱复核 |
      | 1.5–1.7，玻璃感 | 疑似玻璃 | 第 3 步 |

      **2. 对刚玉检测紫外荧光（LW 紫外灯）**

      | 荧光 | 结论 |
      |---|---|
      | 强红 | 支持红宝石候选，仍需复核 |
      | 弱或无 | 不能单独排除红宝石，需进一步检测 |

      **3. 对疑似玻璃观察气泡 / 旋涡纹**

      | 观察 | 结论 |
      |---|---|
      | 有气泡或流动纹 | 支持玻璃仿品候选 |
      | 无 | 不能排除仿品，复查读数并补充检测 |
    steps_en: |
      **1. Measure the refractive index (RI)** with a refractometer.

      | RI reading | Likely family | Next |
      |---|---|---|
      | 1.76 | Corundum (ruby / sapphire) | Step 2 |
      | 1.71–1.72 | Possible spinel | Cross-check SG, inclusions, and spectroscopy |
      | 1.74–1.89 | Possible garnet | Cross-check SG, inclusions, and spectroscopy |
      | 1.5–1.7, glassy | Possible glass | Step 3 |

      **2. For corundum, check UV fluorescence** under a LW lamp.

      | Fluorescence | Conclusion |
      |---|---|
      | Strong red | Supports a ruby candidate; cross-check |
      | Weak or none | Does not exclude ruby; test further |

      **3. For a glassy stone, look for bubbles / swirls.**

      | Observation | Conclusion |
      |---|---|
      | Bubbles or flow lines | Supports a glass imitation candidate |
      | None | Does not exclude an imitation; re-check and add tests |
    principles_zh: |
      - 红：红宝石 RI 1.76 + 强红荧光；尖晶石 1.71–1.72 无荧光；石榴石 1.74–1.89。
      - 蓝：蓝宝石约 1.76，可能见二色性；坦桑石 1.69–1.70 强三色性；堇青石 1.54 三色性极强。
      - 绿：祖母绿 1.57–1.58（浸油裂隙）；翠榴石 1.89 高色散；橄榄石 1.65–1.69（双影）。
      - 荧光只能作为筛分线索：天然红宝石常见 LW 红色反应，但强弱受产地、处理与样品影响；合成品也可能出现相近反应。
      - 任何单一观察都不能替代实验室鉴定；紫外灯、划痕和液体测试须按器材安全规范操作。
    principles_en: |
      - Red: ruby RI 1.76 + strong red fluor.; spinel 1.71–1.72 none; garnet 1.74–1.89.
      - Blue: sapphire 1.76 dichroic blue/green; tanzanite 1.69–1.70 strongly trichroic; iolite 1.54 trichroism extreme.
      - Green: emerald 1.57–1.58 (oiled fissures); tsavorite 1.89 high dispersion; peridot 1.65–1.69 (doubling).
      - Fluorescence is only a screening clue: natural ruby may show strong LW red, but intensity varies with origin, treatment, and sample; synthetics can overlap.
      - No single observation replaces laboratory identification; use UV, scratch, and liquid tests only with appropriate equipment and safety procedures.
    examples:
      - { gem: "ruby", value: "RI 1.76 + red fluor.", note_en: "vs spinel 1.72" }
      - { gem: "sapphire", value: "RI 1.76, no pleochroism", note_en: "vs tanzanite 1.69 trichroic" }
      - { gem: "emerald", value: "RI 1.57 + oil fissures", note_en: "vs tsavorite 1.89" }
