# Gem cutting taxonomy — how rough becomes a polished gem.
#
# Each entry is one cutting topic. Generator emits a bilingual subpage per
# entry plus the overview. Claims below are mapped to the references and
# evidence status at the end of this file.

overview_zh: |
  切割是把原石转化为宝石的工艺与科学，可以从两个层面理解：一是成品形态，
  如刻面、蛋面与雕刻；二是刻面内部的轮廓与切面风格，如圆明亮式、祖母绿式、
  公主方、梨形和马眼形。路线选择还要综合透明度、包裹体、耐久性、光学效应与原石形状。
overview_en: |
  Cutting transforms rough into a gem and can be understood on two levels: finished form,
  such as faceted, cabochon, or carved; and, within faceting, outline and facet style,
  such as round brilliant, emerald step, princess, pear, or marquise. Choice also depends
  on transparency, inclusions, durability, phenomena, and the shape of the rough.

