# Gem grading taxonomy — 4Cs and colored-stone frameworks.
#
# Each entry describes a grading topic. Generator emits one bilingual subpage
# per entry plus an overview index. IDs are kebab-case and stable.
#
# References: GIA Diamond Grading Manual; GIA Colored Stone Grading; CIBJO
# Diamond, Precious Metals and Gemstones commissions; ICA coloured gemstone
# guidelines; AGTA disclosure standards.

overview_zh: |
  分级是把宝石的外观、重量与报告特征组织成可比较描述的行业惯例；
  真实性由鉴定与处理披露支持，而不是由分级单独证明。
  本模块讲解 GIA 4C 钻石分级框架（Carat / Color / Clarity / Cut），
  以及彩色宝石独立的 hue-tone-saturation 模型，
  并说明净度特征、处理披露与产地意见之间的边界。
overview_en: |
  Grading organizes a stone's weight, appearance, and report characteristics
  into comparable descriptions. Identification and disclosure support claims
  about identity, treatment, and authenticity.
  This module covers the GIA 4C diamond framework (Carat / Color / Clarity /
  Cut), the hue-tone-saturation model for coloured gems, and the boundaries
  between clarity features, treatment disclosure, and origin opinions.
boundary_zh: |
  本模块用于学习分级描述、报告术语和证据边界，不是在线评级、估价或样品鉴定工具。
  分级不能单独证明天然/合成、处理状态、产地或市场价格；正式报告和交易披露应以适用的实验室、规则与司法辖区为准。
boundary_en: |
  This module teaches grading descriptions, report terms, and evidence boundaries; it is not an online grading, valuation, or specimen-identification tool.
  Grading alone cannot establish natural/synthetic status, treatment, geographic origin, or market price. Formal reports and disclosures depend on the applicable laboratory, rules, and jurisdiction.

